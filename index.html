<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REGISTRO PERSONAL OP-HIDALGO - Generador PDF + JSON + F3</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px;
    }

    .container {
        background: #fff;
        max-width: 900px;
        width: 100%;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .container h1 {
        color: #1e3c72;
        font-size: 22px;
        text-align: center;
        margin-bottom: 8px;
        letter-spacing: 1px;
    }

    .container h1::after {
        content: '';
        display: block;
        width: 60px;
        height: 3px;
        background: #2a5298;
        margin: 10px auto 25px;
        border-radius: 2px;
    }

    .section-title {
        font-size: 14px;
        font-weight: 700;
        color: #2a5298;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 25px 0 12px;
        padding-bottom: 5px;
        border-bottom: 1px solid #e0e0e0;
    }

    .section-title:first-of-type { margin-top: 0; }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    @media (max-width: 640px) {
        .grid { grid-template-columns: 1fr; }
    }

    .form-group { margin-bottom: 4px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
        display: block;
        font-weight: 600;
        color: #333;
        margin-bottom: 6px;
        font-size: 13px;
    }

    input, select, textarea {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 13px;
        font-family: inherit;
        transition: 0.2s;
        background: #fafafa;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #2a5298;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(42,82,152,0.15);
    }

    textarea { resize: vertical; min-height: 60px; }

    .checkbox-group {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 8px;
        background: #fafafa;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 12px;
    }

    .checkbox-group label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 400;
        font-size: 13px;
        margin: 0;
        cursor: pointer;
        color: #333;
    }

    .checkbox-group input[type="checkbox"] {
        width: auto;
        margin: 0;
        cursor: pointer;
    }

    .button-group {
        display: flex;
        gap: 15px;
        margin-top: 25px;
        flex-wrap: wrap;
    }

    .btn {
        flex: 1;
        min-width: 180px;
        padding: 14px;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-pdf  { background: linear-gradient(135deg, #1e3c72, #2a5298); }
    .btn-pdf:hover  { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,60,114,0.4); }

    .btn-json { background: linear-gradient(135deg, #1d7a3e, #28a745); }
    .btn-json:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(29,122,62,0.4); }

    .btn-f3   { background: linear-gradient(135deg, #8b1e1e, #c0392b); }
    .btn-f3:hover   { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139,30,30,0.4); }

    .btn-clear {
        background: linear-gradient(135deg, #6c757d, #868e96);
        flex: 0 0 auto;
        min-width: 160px;
    }
    .btn-clear:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(108,117,125,0.4); }

    .btn:active { transform: translateY(0); }

    .status-msg {
        margin-top: 15px;
        padding: 10px 15px;
        border-radius: 6px;
        font-size: 13px;
        text-align: center;
        display: none;
    }
    .status-msg.show { display: block; }
    .status-msg.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-msg.info    { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

    .progress-info {
        margin-top: 12px;
        font-size: 12px;
        color: #666;
        text-align: center;
    }
    .progress-info .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        margin: 0 4px;
        font-weight: 600;
    }
    .badge-pending { background: #f8d7da; color: #721c24; }
    .badge-done    { background: #d4edda; color: #155724; }
</style>
</head>
<body>

<div class="container">
    <h1>REGISTRO PERSONAL OP-HIDALGO</h1>

    <form id="formEjecutivo" autocomplete="off" action="javascript:void(0);" onsubmit="return false;">

        <!-- ============ DATOS GENERALES ============ -->
        <div class="section-title">Datos generales</div>
        <div class="grid">
            <div class="form-group">
                <label for="fechaLlenado">Fecha de llenado</label>
                <input type="date" id="fechaLlenado" required>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre completo (iniciar con nombre)</label>
                <input type="text" id="nombre" required placeholder="Ej. Juan Pérez López">
            </div>

            <div class="form-group">
                <label for="ome">OME</label>
                <select id="ome" required>
                    <option value="" disabled selected>Selecciona una OME</option>
                    <option value="ACTOPAN">ACTOPAN</option>
                    <option value="APAN">APAN</option>
                    <option value="ECATEPEC">ECATEPEC</option>
                    <option value="TEPEJI DEL RIO">TEPEJI DEL RIO</option>
                    <option value="TULANCINGO DE BRAVO">TULANCINGO DE BRAVO</option>
                </select>
            </div>

            <div class="form-group">
                <label for="rfc">RFC</label>
                <input type="text" id="rfc" maxlength="13" required placeholder="Ej. PELJ850101ABC">
            </div>

            <div class="form-group">
                <label for="curp">CURP</label>
                <input type="text" id="curp" maxlength="18" required placeholder="Ej. PELJ850101HDFRRN01">
            </div>

            <div class="form-group">
                <label for="cargo">Cargo</label>
                <select id="cargo" required>
                    <option value="" disabled selected>Selecciona un cargo</option>
                    <option value="TITULAR DE LA JEFATURA DE OFICINA">TITULAR DE LA JEFATURA DE OFICINA</option>
                    <option value="SUPLENTE">SUPLENTE</option>
                    <option value="AUXILIAR ADMINISTRATIVO">AUXILIAR ADMINISTRATIVO</option>
                    <option value="GESTOR">GESTOR</option>
                    <option value="COMISIONADO">COMISIONADO</option>
                </select>
            </div>

            <div class="form-group">
                <label for="tipo">Tipo</label>
                <select id="tipo" required>
                    <option value="" disabled selected>Selecciona un tipo</option>
                    <option value="SRE">SRE</option>
                    <option value="ESTATAL">ESTATAL</option>
                    <option value="MUNICIPAL">MUNICIPAL</option>
                </select>
            </div>
        </div>

        <!-- ============ FECHAS Y ETAPAS ============ -->
        <div class="section-title">Fechas y etapas</div>
        <div class="grid">
            <div class="form-group">
                <label for="fechaIngresoSUA">Fecha de ingreso SRE</label>
                <input type="date" id="fechaIngresoSUA" required>
            </div>

            <div class="form-group">
                <label for="fechaIngresoProduccion">Fecha de ingreso producción</label>
                <input type="date" id="fechaIngresoProduccion" required>
            </div>

            <div class="form-group">
                <label for="fechaCertificacion">Fecha de certificación</label>
                <input type="date" id="fechaCertificacion" required>
            </div>

            <div class="form-group full">
                <label>Etapas de intervención</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="etapas" value="Recepción"> Recepción</label>
                    <label><input type="checkbox" name="etapas" value="Dictaminación"> Dictaminación</label>
                    <label><input type="checkbox" name="etapas" value="Captura de Datos"> Captura de Datos</label>
                    <label><input type="checkbox" name="etapas" value="Autorización/Impresión"> Autorización/Impresión</label>
                    <label><input type="checkbox" name="etapas" value="Ensamble"> Ensamble</label>
                    <label><input type="checkbox" name="etapas" value="Control de Calidad"> Control de Calidad</label>
                    <label><input type="checkbox" name="etapas" value="Digitalización"> Digitalización</label>
                    <label><input type="checkbox" name="etapas" value="Entrega"> Entrega</label>
                    <label><input type="checkbox" name="etapas" value="Transmisión"> Transmisión</label>
                </div>
            </div>
        </div>

        <!-- ============ DATOS LABORALES Y PERSONALES ============ -->
        <div class="section-title">Datos laborales y personales</div>
        <div class="grid">
            <div class="form-group">
                <label for="horarioLaboral">Horario laboral</label>
                <input type="text" id="horarioLaboral" required placeholder="Ej. 09:00 - 18:00">
            </div>

            <div class="form-group">
                <label for="trabajoAnterior">Trabajo anterior</label>
                <input type="text" id="trabajoAnterior" required placeholder="Ej. Servidor público estatal">
            </div>

            <div class="form-group full">
                <label for="domicilio">Domicilio</label>
                <input type="text" id="domicilio" required placeholder="Calle, número, colonia, CP, ciudad">
            </div>

            <div class="form-group">
                <label for="identificacion">Identificación</label>
                <select id="identificacion" required>
                    <option value="" disabled selected>Selecciona una identificación</option>
                    <option value="INE">INE</option>
                    <option value="CÉDULA PROFESIONAL">CÉDULA PROFESIONAL</option>
                    <option value="OTRO">OTRO</option>
                </select>
            </div>

            <div class="form-group">
                <label for="folioId">Folio ID</label>
                <input type="text" id="folioId" required placeholder="Ej. ID-2026-0001">
            </div>

            <div class="form-group">
                <label for="contactoEmergencia">Contacto de emergencia</label>
                <input type="text" id="contactoEmergencia" required placeholder="Nombre completo del contacto">
            </div>

            <div class="form-group">
                <label for="domicilioContacto">Domicilio del contacto</label>
                <input type="text" id="domicilioContacto" required placeholder="Calle, número, colonia, CP">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" required placeholder="Ej. 7711234567">
            </div>

            <div class="form-group">
                <label for="correoPersonal">Correo personal</label>
                <input type="email" id="correoPersonal" required placeholder="Ej. correo@dominio.com">
            </div>
        </div>
    </form>

    <div class="button-group">
        <button type="button" id="btnGenerarPDF"  class="btn btn-pdf">Generar Promesa PDF</button>
        <button type="button" id="btnGenerarJSON" class="btn btn-json">Generar JSON</button>
        <button type="button" id="btnGenerarF3"   class="btn btn-f3">Generar Certificación (F3)</button>
        <button type="button" id="btnLimpiar"     class="btn btn-clear">Limpiar Formulario</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
    <div class="progress-info">
        Estado:
        <span id="badgePdf"  class="badge badge-pending">Promesa: pendiente</span>
        <span id="badgeJson" class="badge badge-pending">JSON: pendiente</span>
        <span id="badgeF3"   class="badge badge-pending">F3: pendiente</span>
    </div>
</div>

let pdfGenerado  = false;
let jsonGenerado = false;
let f3Generado   = false;

/* ============================================================
   LISTA DE IDs DE CAMPOS
   ============================================================ */
const CAMPOS_TEXTO = [
    'fechaLlenado', 'nombre', 'ome', 'rfc', 'curp', 'cargo', 'tipo',
    'fechaIngresoSUA', 'fechaIngresoProduccion', 'fechaCertificacion',
    'horarioLaboral', 'trabajoAnterior', 'domicilio', 'identificacion',
    'folioId', 'contactoEmergencia', 'domicilioContacto', 'telefono',
    'correoPersonal'
];

/* ============================================================
   SNAPSHOT
   ============================================================ */
function tomarSnapshot() {
    const snapshot = {};
    CAMPOS_TEXTO.forEach(id => {
        const el = document.getElementById(id);
        if (el) snapshot[id] = el.value;
    });
    snapshot.__etapas = Array.from(
        document.querySelectorAll('input[name="etapas"]:checked')
    ).map(cb => cb.value);
    return snapshot;
}

function restaurarSnapshot(snapshot) {
    if (!snapshot) return;
    CAMPOS_TEXTO.forEach(id => {
        const el = document.getElementById(id);
        if (el && snapshot[id] !== undefined) {
            el.value = snapshot[id];
        }
    });
    const etapas = snapshot.__etapas || [];
    document.querySelectorAll('input[name="etapas"]').forEach(cb => {
        cb.checked = etapas.includes(cb.value);
    });
}

function protegerFormulario(snapshot) {
    let intentos = 0;
    const MAX_INTENTOS = 30;
    const INTERVALO   = 100;

    const intervalo = setInterval(() => {
        restaurarSnapshot(snapshot);
        intentos++;
        if (intentos >= MAX_INTENTOS) clearInterval(intervalo);
    }, INTERVALO);
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function mostrarMensaje(texto, tipo) {
    const msg = document.getElementById('statusMsg');
    msg.textContent = texto;
    msg.className = 'status-msg show ' + (tipo || 'info');
}

function ocultarMensaje() {
    const msg = document.getElementById('statusMsg');
    msg.textContent = '';
    msg.className = 'status-msg';
}

function actualizarBadges() {
    const bPdf  = document.getElementById('badgePdf');
    const bJson = document.getElementById('badgeJson');
    const bF3   = document.getElementById('badgeF3');

    if (pdfGenerado) {
        bPdf.textContent = 'Promesa: ✓ generado';
        bPdf.className   = 'badge badge-done';
    } else {
        bPdf.textContent = 'Promesa: pendiente';
        bPdf.className   = 'badge badge-pending';
    }

    if (jsonGenerado) {
        bJson.textContent = 'JSON: ✓ generado';
        bJson.className   = 'badge badge-done';
    } else {
        bJson.textContent = 'JSON: pendiente';
        bJson.className   = 'badge badge-pending';
    }

    if (f3Generado) {
        bF3.textContent = 'F3: ✓ generado';
        bF3.className   = 'badge badge-done';
    } else {
        bF3.textContent = 'F3: pendiente';
        bF3.className   = 'badge badge-pending';
    }
}

function validarFormulario() {
    const form = document.getElementById('formEjecutivo');
    if (!form.checkValidity()) {
        form.reportValidity();
        return false;
    }
    return true;
}

function obtenerDatos() {
    return {
        fechaLlenado:       document.getElementById('fechaLlenado').value,
        nombre:             document.getElementById('nombre').value.trim(),
        ome:                document.getElementById('ome').value.trim(),
        rfc:                document.getElementById('rfc').value.trim().toUpperCase(),
        curp:               document.getElementById('curp').value.trim().toUpperCase(),
        cargo:              document.getElementById('cargo').value.trim(),
        tipo:               document.getElementById('tipo').value.trim(),
        fechaIngresoSUA:    document.getElementById('fechaIngresoSUA').value,
        fechaIngresoProd:   document.getElementById('fechaIngresoProduccion').value,
        fechaCertificacion: document.getElementById('fechaCertificacion').value,
        horarioLaboral:     document.getElementById('horarioLaboral').value.trim(),
        trabajoAnterior:    document.getElementById('trabajoAnterior').value.trim(),
        domicilio:          document.getElementById('domicilio').value.trim(),
        identificacion:     document.getElementById('identificacion').value.trim(),
        folioId:            document.getElementById('folioId').value.trim(),
        contactoEmergencia: document.getElementById('contactoEmergencia').value.trim(),
        domicilioContacto:  document.getElementById('domicilioContacto').value.trim(),
        telefono:           document.getElementById('telefono').value.trim(),
        correoPersonal:     document.getElementById('correoPersonal').value.trim(),
        etapasSeleccionadas: Array.from(
            document.querySelectorAll('input[name="etapas"]:checked')
        ).map(cb => cb.value)
    };
}

function formatearFecha(iso) {
    if (!iso) return '';
    return new Date(iso + 'T00:00:00').toLocaleDateString('es-MX', {
        day: '2-digit', month: 'long', year: 'numeric'
    });
}

/* Suma 1 año a una fecha ISO (YYYY-MM-DD) */
function sumarUnAnio(iso) {
    if (!iso) return '';
    const [anio, mes, dia] = iso.split('-');
    const siguiente = parseInt(anio, 10) + 1;
    return siguiente + '-' + mes + '-' + dia;
}

function nombreArchivoLimpio(nombre) {
    return nombre
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '_')
        .replace(/[^a-zA-Z0-9_]/g, '') || 'documento';
}

   DIBUJO DEL ENCABEZADO Y PIE
   ============================================================ */
function aplicarEncabezadoYPie(doc) {
    const pageW = 210;
    const pageH = 297;
    const totalPag = doc.getNumberOfPages();

    const xEnc = 0, yEnc = 0, wEnc = pageW, hEnc = 40;
    const xPie = 0, wPie = pageW, hPie = 42;
    const yPie = pageH - hPie;

    for (let i = 1; i <= totalPag; i++) {
        doc.setPage(i);
        if (ENCABEZADO_BASE64 && ENCABEZADO_BASE64.startsWith('data:image')) {
            doc.addImage(ENCABEZADO_BASE64, 'PNG', xEnc, yEnc, wEnc, hEnc, undefined, 'FAST');
        }
        if (PIE_PAGINA_BASE64 && PIE_PAGINA_BASE64.startsWith('data:image')) {
            doc.addImage(PIE_PAGINA_BASE64, 'PNG', xPie, yPie, wPie, hPie, undefined, 'FAST');
        }
    }
}

document.getElementById('btnGenerarF3').addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();

    if (!validarFormulario()) return;

    const d = obtenerDatos();
    const snapshot = tomarSnapshot();

    const fechaCertLarga = formatearFecha(d.fechaCertificacion);
    const fechaVigencia  = formatearFecha(sumarUnAnio(d.fechaCertificacion));

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });

    const pageW  = 210;
    const margin = 15;
    const textW  = pageW - margin * 2;

    // ============================================================
    // HELPERS DE JUSTIFICACIÓN CON SEGMENTOS MIXTOS (normal/bold)
    // ============================================================

    /**
     * Dado un array de segmentos [{texto, estilo}], calcula
     * las líneas que caben en un ancho dado.
     */
    function calcularLineasMixtas(segmentos, anchoMax, tamanoFuente) {
        doc.setFontSize(tamanoFuente);

        // Convertir cada segmento en un array de "tokens":
        // palabras o espacios, cada uno con su estilo.
        const tokens = [];
        segmentos.forEach(seg => {
            const partes = seg.texto.split(/(\s+)/);
            partes.forEach(p => {
                if (p === '') return;
                tokens.push({ texto: p, estilo: seg.estilo, esEspacio: /^\s+$/.test(p) });
            });
        });

        const lineas = [];
        let lineaActual = [];
        let anchoActual = 0;

        tokens.forEach(tok => {
            doc.setFont('helvetica', tok.estilo);
            const anchoTok = doc.getTextWidth(tok.texto);

            if (tok.esEspacio) {
                // Ignorar espacios al inicio de línea
                if (lineaActual.length === 0) return;
                lineaActual.push(tok);
                anchoActual += anchoTok;
                return;
            }

            if (anchoActual + anchoTok > anchoMax && lineaActual.length > 0) {
                // Cerrar línea actual (quitar espacios al final)
                while (lineaActual.length > 0 && lineaActual[lineaActual.length - 1].esEspacio) {
                    lineaActual.pop();
                }
                lineas.push(lineaActual);
                lineaActual = [tok];
                anchoActual = anchoTok;
            } else {
                lineaActual.push(tok);
                anchoActual += anchoTok;
            }
        });

        if (lineaActual.length > 0) {
            while (lineaActual.length > 0 && lineaActual[lineaActual.length - 1].esEspacio) {
                lineaActual.pop();
            }
            lineas.push(lineaActual);
        }

        return lineas;
    }

    /**
     * Dibuja las líneas con justificación (excepto la última).
     */
    function dibujarParrafoJustificadoMixto(lineas, x, ancho, yIni, tamanoFuente, altoLinea) {
        let y = yIni;
        doc.setFontSize(tamanoFuente);

        lineas.forEach((linea, idxLinea) => {
            const esUltima = (idxLinea === lineas.length - 1);

            // Calcular ancho real sin contar espacios
            let anchoPalabras = 0;
            const palabras = [];
            linea.forEach(tok => {
                doc.setFont('helvetica', tok.estilo);
                if (!tok.esEspacio) {
                    const w = doc.getTextWidth(tok.texto);
                    palabras.push({ texto: tok.texto, estilo: tok.estilo, ancho: w });
                    anchoPalabras += w;
                }
            });

            const numHuecos = palabras.length - 1;

            if (esUltima || numHuecos <= 0) {
                // Sin justificar: dibujar natural
                let xCursor = x;
                linea.forEach(tok => {
                    doc.setFont('helvetica', tok.estilo);
                    doc.text(tok.texto, xCursor, y);
                    xCursor += doc.getTextWidth(tok.texto);
                });
            } else {
                // Justificar: repartir espacios sobrantes
                const espacioExtra = (ancho - anchoPalabras) / numHuecos;
                let xCursor = x;
                palabras.forEach((p, i) => {
                    doc.setFont('helvetica', p.estilo);
                    doc.text(p.texto, xCursor, y);
                    xCursor += p.ancho;
                    if (i < palabras.length - 1) {
                        xCursor += espacioExtra;
                    }
                });
            }

            y += altoLinea;
        });

        return y;
    }

    // ============================================================
    // BLOQUE SUPERIOR DERECHO
    // ============================================================
    const xTabla = margin;
    const yTabla = 42;
    const wTabla = textW;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8.5);
    doc.setTextColor(20, 20, 20);

    let yEncF3 = yTabla + 5;

        'Unidad de Administración y Finanzas',
        'Dirección General de Pasaportes',
        'Oficina de Pasaportes en Hidalgo'
    ];

        doc.text(txt, pageW - margin - 2, yEncF3, { align: 'right' });
        yEncF3 += 3.5;
    });

    doc.setFont('helvetica', 'bolditalic');
    doc.text('Formato 3', pageW - margin - 2, yEncF3, { align: 'right' });

    const yLineaTop = yEncF3 + 2;
    doc.setDrawColor(0, 0, 0);
    doc.setLineWidth(0.6);
    doc.line(xTabla, yLineaTop, xTabla + wTabla, yLineaTop);

    // ============================================================
    // BARRA GRIS: "CERTIFICACIÓN"
    // ============================================================
    const hBarra = 6;
    const yBarraCert = yLineaTop;
    doc.setFillColor(128, 128, 128);
    doc.rect(xTabla, yBarraCert, wTabla, hBarra, 'F');

    let yCursor = yBarraCert + hBarra;
    doc.setDrawColor(0, 0, 0);
    doc.setLineWidth(0.3);
    doc.line(xTabla, yCursor, xTabla + wTabla, yCursor);

    // ============================================================
    // FILA: "Pachuca de Soto, Hidalgo a ..."
    // ============================================================
    const hFilaFecha = 7;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(0, 0, 0);
    doc.text(
        'Pachuca de Soto, Hidalgo a ' + fechaCertLarga,
        pageW - margin - 3,
        yCursor + 4.5,
        { align: 'right' }
    );
    yCursor += hFilaFecha;
    doc.line(xTabla, yCursor, xTabla + wTabla, yCursor);

    // ============================================================
    // FILA: "Vigencia al ..."
    // ============================================================
    const hFilaVig = 7;

        'Vigencia al ' + fechaVigencia,
        pageW - margin - 3,
        yCursor + 4.5,
        { align: 'right' }
    );
    yCursor += hFilaVig;
    doc.line(xTabla, yCursor, xTabla + wTabla, yCursor);

    // ============================================================
    // FILA GRIS: "OFICINA DE PASAPORTES EN HIDALGO"
    // ============================================================
    const hFilaOficina = 7;
    doc.setFillColor(190, 190, 190);
    doc.rect(xTabla, yCursor, wTabla, hFilaOficina, 'F');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(0, 0, 0);
    doc.text('OFICINA DE PASAPORTES EN HIDALGO', pageW / 2, yCursor + 4.6, { align: 'center' });
    yCursor += hFilaOficina;
    doc.line(xTabla, yCursor, xTabla + wTabla, yCursor);

    // ============================================================
    // PÁRRAFO PRINCIPAL (JUSTIFICADO CON SEGMENTOS MIXTOS)
    // ============================================================
    const xTexto = xTabla + 4;
    const wTexto = wTabla - 8;
    const tamanoFuenteParrafo = 9.5;
    const altoLineaParrafo = 4.5;

    // Armar los segmentos mezclando normal y bold
    const segmentosParrafo = [
        { texto: 'El suscrito Director de la Oficina de Pasaportes en Hidalgo ', estilo: 'normal' },
        { texto: 'JAIME CERECEDO VITE,', estilo: 'bold' },
        { texto: 'con CURP ', estilo: 'normal' },

    // ============================================================

        document.getElementById('formEjecutivo').reset();
        pdfGenerado  = false;
        jsonGenerado = false;
        f3Generado   = false;
        actualizarBadges();
        ocultarMensaje();
        mostrarMensaje('Formulario limpiado.', 'success');
    }
});

/* ============================================================
   BLOQUEAR SUBMIT
   ============================================================ */
document.getElementById('formEjecutivo').addEventListener('submit', function (e) {
    e.preventDefault();
    e.stopPropagation();
    return false;
});

/* Inicializar */
actualizarBadges();
</script>
